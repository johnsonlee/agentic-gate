[versions]
kotlin = "2.0.21"
lint = "31.8.2"
android-gradle = "8.8.2"
sonatype-publish = "2.0.1"

[libraries]
android-lint = { module = "com.android.tools.lint:lint", version.ref = "lint" }
android-lint-api = { module = "com.android.tools.lint:lint-api", version.ref = "lint" }
android-lint-tests = { module = "com.android.tools.lint:lint-tests", version.ref = "lint" }
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "android-gradle" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "android-gradle" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
sonatype-publish = { id = "io.johnsonlee.sonatype-publish-plugin", version.ref = "sonatype-publish" }
