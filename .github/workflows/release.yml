name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and release
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tags must use 1.2.3 or v1.2.3, optionally followed by a prerelease suffix such as -rc.1." >&2
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged commit
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node for npm publishing
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate repository
        run: bun run ci

      - name: Apply tag version to npm packages
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { readFile, writeFile } from "node:fs/promises";

          const packagePaths = [
            "es/engine/package.json",
            "es/rules/package.json",
            "es/cli/package.json"
          ];
          const releasePackages = new Set([
            "agentic-gate-engine",
            "agentic-gate-rules",
            "agentic-gate-cli"
          ]);

          for (const path of packagePaths) {
            const packageJson = JSON.parse(await readFile(path, "utf8"));
            packageJson.version = process.env.RELEASE_VERSION;
            for (const dependencyGroup of ["dependencies", "devDependencies", "peerDependencies"]) {
              const dependencies = packageJson[dependencyGroup];
              if (!dependencies) continue;
              for (const dependency of Object.keys(dependencies)) {
                if (releasePackages.has(dependency)) {
                  dependencies[dependency] = process.env.RELEASE_VERSION;
                }
              }
            }
            await writeFile(path, `${JSON.stringify(packageJson, null, 2)}\n`);
          }
          EOF

      - name: Publish JVM artifacts to Maven Central
        env:
          GPG_KEY_ARMOR: ${{ secrets.GPG_KEY_ARMOR }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          OSSRH_PACKAGE_GROUP: ${{ secrets.OSSRH_PACKAGE_GROUP }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          echo "$GPG_KEY_ARMOR" | base64 --decode > "$GITHUB_WORKSPACE/secring.gpg"
          ./gradlew clean publishToSonatype closeAndReleaseSonatypeStagingRepository --no-daemon \
            -Pversion="$RELEASE_VERSION" \
            -POSSRH_USERNAME="$OSSRH_USERNAME" \
            -POSSRH_PASSWORD="$OSSRH_PASSWORD" \
            -POSSRH_PACKAGE_GROUP="$OSSRH_PACKAGE_GROUP" \
            -Psigning.keyId="$GPG_KEY_ID" \
            -Psigning.password="$GPG_PASSPHRASE" \
            -Psigning.secretKeyRingFile="$GITHUB_WORKSPACE/secring.gpg"

      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        shell: bash
        run: |
          for package_dir in es/engine es/rules es/cli; do
            (cd "$package_dir" && npm publish --access public --provenance --tag "$NPM_TAG")
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          args=("$TAG" --verify-tag --title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
